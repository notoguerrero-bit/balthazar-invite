<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balthazar is now level 9 🎮</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    body {
        margin: 0;
        padding: 0;
        font-family: 'Press Start 2P', cursive;
        background-color: #000000;
        color: #ccffcc;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }
    .container {
        background-color: rgba(0, 0, 0, 0.85);
        border: 4px solid #39ff14;
        border-radius: 20px;
        padding: 30px;
        text-align: center;
        max-width: 420px;
        box-shadow: 0 0 25px #39ff14;
        position: relative;
        animation: glow 2s infinite alternate;
    }
    @keyframes glow {
        0% { box-shadow: 0 0 15px #39ff14; }
        100% { box-shadow: 0 0 35px #39ff14; }
    }
    h1 {
        color: #39ff14;
        font-size: 22px;
        margin-bottom: 10px;
        text-shadow: none;
    }
    p {
        color: #ccffcc;
        font-size: 12px;
        margin-bottom: 20px;
    }
    input {
        width: 80%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 10px;
        border: 2px solid #39ff14;
        background-color: #000;
        color: #ccffcc;
        text-align: center;
        font-size: 12px;
    }
    .btn {
        display: block;
        width: 60%;
        margin: 10px auto;
        padding: 14px;
        border-radius: 10px;
        border: 2px solid #39ff14;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
        text-decoration: none;
        color: #000;
        background-color: #39ff14;
        text-shadow: 0 0 2px #000;
    }
    .btn:hover {
        background-color: #0f0;
        color: #000;
        text-shadow: 0 0 5px #fff;
    }
    .pixel-stars {
        position: absolute;
        width: 2px;
        height: 2px;
        background: #0ff;
        animation: blink 1.5s infinite alternate;
    }
    @keyframes blink {
        0% { opacity: 0; }
        100% { opacity: 1; }
    }
</style>
</head>
<body>
<div class="container">
    <h1>🎮 Balthazar is now level 9 🎂</h1>
    <p>Enter your name and number of guests, then hit Ready to play!</p>

    <input type="text" id="name" placeholder="Your Name">
    <input type="number" id="guests" placeholder="Number of Guests" min="0">

    <a href="#" id="yesBtn" class="btn">Ready to play! ✅</a>
    <a href="#" id="noBtn" class="btn">Maybe next time ❌</a>
</div>

<script>
const phoneNumber = "14088253681";

function createWhatsAppLink(attendance) {
    const name = encodeURIComponent(document.getElementById('name').value || '[Name]');
    const guests = encodeURIComponent(document.getElementById('guests').value || '0');
    const message = `Hi! I'm ${name} and ${attendance} Balthazar's 9th birthday party. Guests: ${guests}`;
    return `https://wa.me/${phoneNumber}?text=${message}`;
}

document.getElementById('yesBtn').addEventListener('click', function() {
    window.open(createWhatsAppLink("will attend"), "_blank");
});

document.getElementById('noBtn').addEventListener('click', function() {
    window.open(createWhatsAppLink("won't attend"), "_blank");
});

for(let i=0;i<50;i++){
    const star = document.createElement('div');
    star.className='pixel-stars';
    star.style.top=Math.random()*100+'%';
    star.style.left=Math.random()*100+'%';
    star.style.width=Math.random()*3+1+'px';
    star.style.height=star.style.width;
    star.style.backgroundColor = '#0ff';
    document.body.appendChild(star);
}
</script>
</body>
</html>
